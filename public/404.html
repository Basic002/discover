<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DISCOVER ✦ Live Music & Concerts</title>
    <script type="text/javascript">
      // Redirection automatique universelle des routes SPA GitHub Pages vers index.html
      // Détecte automatiquement si le site est à la racine (Basic002.github.io ou domaine personnalisé)
      // ou dans un sous-dossier de dépôt (ex: Basic002.github.io/musical-app-frontend/)
      var knownRoutes = ['login', 'register', 'profile', 'favorites', 'admin'];
      var firstSegment = window.location.pathname.split('/')[1] || '';
      var pathSegmentsToKeep = (knownRoutes.indexOf(firstSegment) !== -1 || !firstSegment) ? 0 : 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
